<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Commander · retour Withings</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 15vh auto; padding: 0 1rem; color: #1c2230; }
  code { display: block; padding: .75rem 1rem; background: #eef1f6; border-radius: 8px; font-size: 1.05rem; word-break: break-all; user-select: all; }
  button { margin-top: .75rem; padding: .5rem 1rem; font: inherit; border: 1px solid #99a; border-radius: 8px; background: #fff; cursor: pointer; }
  .muted { color: #667; font-size: .9rem; }
</style>
</head>
<body>
<h1>Connexion Withings</h1>
<div id="ok" hidden>
  <p>Copie ce code et colle-le dans Commander (il n’est valable que <strong>30 secondes</strong>).</p>
  <code id="code"></code>
  <button id="copy" type="button">Copier le code</button>
  <p class="muted" id="done"></p>
</div>
<p id="ko" hidden>Aucun code reçu. Retourne dans Commander et relance « Connecter Withings ».</p>
<p class="muted">Cette page n’envoie rien : le code reste dans ton navigateur et ne sert à rien sans le secret conservé dans Commander.</p>
<script>
  var p = new URLSearchParams(location.search), code = p.get('code'), state = p.get('state');
  if (code) {
    var value = state ? code + ' ' + state : code;
    document.getElementById('code').textContent = value;
    document.getElementById('ok').hidden = false;
    var copy = function () {
      return navigator.clipboard.writeText(value).then(function () { document.getElementById('done').textContent = 'Code copié.'; },
        function () { document.getElementById('done').textContent = 'Copie automatique impossible : sélectionne le code ci-dessus.'; });
    };
    document.getElementById('copy').onclick = copy; copy();
    history.replaceState(null, '', location.pathname);
  } else { document.getElementById('ko').hidden = false; }
</script>
</body>
</html>
